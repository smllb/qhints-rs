name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev

      - name: Build (default)
        run: cargo build --release

      - name: Build (OCR feature)
        run: |
          mv target/release/qhints-rs target/release/qhints-rs-default
          cargo build --release --features ocr
          mv target/release/qhints-rs target/release/qhints-rs-ocr
          mv target/release/qhints-rs-default target/release/qhints-rs

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/qhints-rs
            target/release/qhints-rs-ocr
